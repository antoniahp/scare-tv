# Render's free plan puts the web service to sleep after 15 minutes without visits
# (and the first visit then waits ~1 minute). This pings it every 5 minutes so it stays awake.
# One always-on service uses ~744 h/month, inside Render's 750 free hours per workspace.
name: Keep Scare-TV awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS -o /dev/null -w "%{http_code} in %{time_total}s\n" --retry 3 --retry-delay 10 --max-time 90 https://scare-tv.onrender.com/
