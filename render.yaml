# Render Blueprint: the web mirror + its anonymous stats API (Django + DRF), the /admin to browse it, and a free PostgreSQL database.
# On Render: New → Blueprint → pick this repository. Nothing to fill in by hand: the secret key is generated
# and the database URL is wired in automatically. Faces are still processed in each visitor's browser;
# the server only receives numbers (which scare, how far the face jumped).
databases:
  - name: scare-tv-db
    plan: free
    databaseName: scare_tv
    user: scare_tv

services:
  - type: web
    name: scare-tv
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip poetry && poetry install --no-root --only web && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scare-tv-db
          property: connectionString
      # The /admin login. Set DJANGO_SUPERUSER_PASSWORD yourself in Render → scare-tv → Environment:
      # the user is created on the next start (and left alone afterwards).
      - key: DJANGO_SUPERUSER_USERNAME
        value: antonia
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@scare-tv.local
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
